spring:
  application:
    name: finance-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${DB_USER:finance}
    password: ${DB_PASSWORD:finance}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/New_York
  sync:
    scheduler-enabled: ${SYNC_SCHEDULER_ENABLED:true}
    # Spring cron (sec min hour day month weekday), in America/New_York: 00:00, 06:00, 12:00, 18:00.
    cron: ${SYNC_CRON:0 0 */6 * * *}
    follow-up-delays: 15s, 30s, 1m, 2m, 4m, 8m, 15m
  ai:
    # Model for the categorization step (SPEC §7 step 4). Runs at low effort; batches of up to 50.
    model: ${AI_MODEL:claude-opus-5-5}
    batch-size: 50
    # Let the API retry a declined request on a fallback model (beta server-side-fallback-2026-07-01).
    server-fallbacks: ${AI_SERVER_FALLBACKS:true}
  sample-data:
    # Dev only. Removed automatically when the first real institution is linked.
    enabled: ${SAMPLE_DATA:false}
    dir: ${SAMPLE_DATA_DIR:../reference/sample-data}
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

app:
  plaid:
    client-id: ${PLAID_CLIENT_ID:}
    secret: ${PLAID_SECRET:}
    env: ${PLAID_ENV:sandbox}
    # Needed for OAuth banks (Phase 6): the app's HTTPS address + /oauth-return, registered in the Plaid dashboard.
    redirect-uri: ${PLAID_REDIRECT_URI:}
  token-enc-key: ${TOKEN_ENC_KEY:}
  anthropic-api-key: ${ANTHROPIC_API_KEY:}
  password-hash: ${APP_PASSWORD_HASH:}
  time-zone: America/New_York
  sync:
    scheduler-enabled: ${SYNC_SCHEDULER_ENABLED:true}
    # Spring cron (sec min hour day month weekday), in America/New_York: 00:00, 06:00, 12:00, 18:00.
    cron: ${SYNC_CRON:0 0 */6 * * *}
    follow-up-delays: 15s, 30s, 1m, 2m, 4m, 8m, 15m
  ai:
    # Model for the categorization step (SPEC §7 step 4). Runs at low effort; batches of up to 50.
    model: ${AI_MODEL:claude-opus-5-5}
    batch-size: 50
    # Let the API retry a declined request on a fallback model (beta server-side-fallback-2026-07-01).
    server-fallbacks: ${AI_SERVER_FALLBACKS:true}
  sample-data:
    # Dev only. Removed automatically when the first real institution is linked.
    enabled: ${SAMPLE_DATA:false}
    dir: ${SAMPLE_DATA_DIR:../reference/sample-data}

logging:
  level:
    root: INFO
